name: Build elish OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: 1582130940/android_kernel_xiaomi_sm8250
        ref: lineage-20.0
        path: kernel
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bc bison flex libssl-dev libncurses5-dev \
          build-essential cpio gzip curl wget git zip libelf-dev 2>&1

    - name: Clone Proton Clang 12 toolchain
      run: |
        git clone --depth 1 https://github.com/kdrag0n/proton-clang.git toolchain
        echo "=== clang version ==="
        toolchain/bin/clang --version | head -3

    - name: Build kernel (Clang 12)
      working-directory: kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- elish_defconfig 2>&1 | tail -30
        DEF_RC=${PIPESTATUS[0]}
        echo "DEFCONFIG_RC=$DEF_RC"
        if [ "$DEF_RC" != "0" ]; then echo "::error::defconfig failed"; exit 1; fi
        make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb 2>&1 | tail -80
        BUILD_RC=${PIPESTATUS[0]}
        echo "BUILD_RC=$BUILD_RC"
        echo "=== output ==="
        ls -lah out/arch/arm64/boot/ 2>&1 || true
        test -f out/arch/arm64/boot/Image.gz-dtb || test -f out/arch/arm64/boot/Image.gz || exit 1

    - name: Package artifacts
      if: always()
      run: |
        mkdir -p package
        cp kernel/out/arch/arm64/boot/Image.gz-dtb package/ 2>/dev/null || true
        cp kernel/out/arch/arm64/boot/Image.gz package/ 2>/dev/null || true
        cp kernel/out/arch/arm64/boot/Image package/ 2>/dev/null || true
        cp kernel/out/.config package/defconfig.config 2>/dev/null || true
        ls -lah package/

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: elish-kernel
        path: package/
        if-no-files-found: error
