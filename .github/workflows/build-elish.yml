name: Build elish OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: 1582130940/android_kernel_xiaomi_sm8250
        ref: lineage-20.0
        path: kernel
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bc bison flex libssl-dev libncurses5-dev \
          build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          cpio gzip curl wget git zip 2>&1

    - name: Inspect defconfigs
      working-directory: kernel
      run: |
        echo "=== available defconfigs ==="
        ls arch/arm64/configs/ | head -30
        echo "=== elish_defconfig exists? ==="
        ls -la arch/arm64/configs/elish_defconfig arch/arm64/configs/vendor/elish_defconfig 2>&1 || true

    - name: Build kernel (GCC)
      working-directory: kernel
      run: |
        set -o pipefail
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        # try both defconfig locations
        make O=out ARCH=arm64 elish_defconfig 2>&1 | tail -40
        DEF_RC=${PIPESTATUS[0]}
        if [ "$DEF_RC" != "0" ]; then
          echo "elish_defconfig failed, trying vendor/"
          make O=out ARCH=arm64 vendor/elish_defconfig 2>&1 | tail -40
          DEF_RC=${PIPESTATUS[0]}
        fi
        echo "DEFCONFIG_RC=$DEF_RC"
        if [ "$DEF_RC" != "0" ]; then echo "::error::no defconfig worked"; exit 1; fi
        make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb 2>&1 | tail -60
        BUILD_RC=${PIPESTATUS[0]}
        echo "BUILD_RC=$BUILD_RC"
        echo "=== output ==="
        ls -la out/arch/arm64/boot/ 2>&1 || true
        if [ "$BUILD_RC" != "0" ]; then echo "::warning::build had errors"; fi
        # 只要有 Image 就继续
        test -f out/arch/arm64/boot/Image.gz-dtb || test -f out/arch/arm64/boot/Image.gz || test -f out/arch/arm64/boot/Image

    - name: Package artifacts
      if: always()
      run: |
        mkdir -p package
        cp kernel/out/arch/arm64/boot/Image.gz-dtb package/ 2>/dev/null || true
        cp kernel/out/arch/arm64/boot/Image.gz package/ 2>/dev/null || true
        cp kernel/out/arch/arm64/boot/Image package/ 2>/dev/null || true
        cp kernel/out/.config package/defconfig.config 2>/dev/null || true
        echo "=== package contents ==="
        ls -lah package/

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: elish-kernel
        path: package/
        if-no-files-found: error
